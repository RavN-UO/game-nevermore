<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="description" content="NEVERMORE — guide a raven through an endless gothic abyss." />

    <!-- iOS PWA / home-screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEVERMORE" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>NEVERMORE</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06060d;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        /* honour iPhone safe areas (notch / home indicator) */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game canvas {
        display: block;
        margin: 0 auto;
      }
      /* boot splash shown before Phaser takes over */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #16182c 0%, #06060d 70%);
        color: #6f7aa8;
        letter-spacing: 0.4em;
        font-size: 13px;
        font-weight: 600;
        transition: opacity 0.4s ease;
        z-index: 10;
      }
      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-splash">NEVERMORE</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
